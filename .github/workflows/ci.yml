name: ci
on:
  push:
  pull_request:
jobs:
  test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest --cov=src --cov-report=xml --junitxml=junit.xml
      - name: Train model
        run: python -m heart.train
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: model-and-tracking
          path: |
            models/
            mlflow.db
            mlruns/
  docker:
    needs: test-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-and-tracking
          path: .
      - name: Build image
        run: docker build -t heart-api:ci .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name api heart-api:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf localhost:8000/health || { docker logs api; exit 1; }
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d @docs/sample_request.json || { docker logs api; exit 1; }
          docker logs api
